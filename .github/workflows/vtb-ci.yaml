# Lean, fork-local CI for the VTB port.
#
# This is ADDITIVE (not in upstream sunnypilot) so it is not a /vtb-sync
# conflict hotspot. It runs only the jobs that give meaningful signal on
# stock GitHub runners — lint, unit tests, and the opendbc Tesla safety
# suite (the real gate, which the upstream tests.yaml does not run).
#
# The heavy/infra-bound jobs in tests.yaml (build release, build macOS,
# UI report, process replay, simulator driving) need comma's self-hosted
# runners or flake on the stock-runner vendored-lib guard; they are NOT
# the day-to-day signal for this fork. Use tests.yaml only for occasional
# full validation via workflow_dispatch.
name: vtb-ci

on:
  push:
    branches:
      - 'vtb-**'
  workflow_dispatch:

concurrency:
  group: vtb-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  PYTHONPATH: ${{ github.workspace }}
  PYTEST: pytest --continue-on-collection-errors --durations=0 -n logical

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      # retry-wrap setup: the vendored-dependency install occasionally flakes
      # on stock runners (the x264/avformat "non-vendored library" red).
      - name: Setup
        uses: nick-fields/retry@7152eba30c6575329ac0576536151aca5a72780e
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: ./tools/op.sh setup
      - name: Static analysis
        timeout-minutes: 2
        run: scripts/lint/lint.sh

  unit_tests:
    name: unit tests
    runs-on: ubuntu-24.04
    # NON-BLOCKING (temporary). The full scons build currently fails on stock
    # GitHub runners at the SConstruct vendored-library guard:
    #   scons: *** Unexpected non-vendored library 'x264'   (SConstruct:73)
    # Root cause is upstream, not VTB: the package-update bot (uv.lock commit
    # 122ac986de, "[bot] Update Python packages (#1861)") re-pinned the vendored
    # ffmpeg wheel so its LIB_DIR no longer exposes a separate libx264, which
    # system/loggerd/SConscript still links. The guard is larch64-skipped, so
    # the on-device build is unaffected, and the pre-#1861 base built green.
    # Kept here (not deleted) so it auto-returns to a blocking signal once
    # /vtb-sync lands a fixed upstream — REMOVE continue-on-error then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Getting LFS files
        uses: nick-fields/retry@7152eba30c6575329ac0576536151aca5a72780e
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: git lfs pull
      - name: Setup
        uses: nick-fields/retry@7152eba30c6575329ac0576536151aca5a72780e
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: ./tools/op.sh setup
      - name: Build openpilot
        run: scons
      - name: Run unit tests
        timeout-minutes: 20
        run: |
          source selfdrive/test/setup_xvfb.sh
          # Pre-compile Python bytecode so each pytest worker doesn't need to
          $PYTEST --collect-only -m 'not slow' -qq
          MAX_EXAMPLES=1 $PYTEST -m 'not slow'

  tesla_safety:
    name: tesla safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      # Lightweight safety run per the project docs: its own venv, bypass the
      # superproject pytest config; libsafety compiles safety.c via cc,
      # no scons needed.
      - name: Run opendbc safety suite
        timeout-minutes: 10
        working-directory: opendbc_repo
        run: |
          uv venv
          uv pip install -e . numpy cffi pytest pytest-xdist
          PYTHONPATH=$(pwd) .venv/bin/python -m pytest opendbc/safety/tests/ -c /dev/null --noconftest -q
